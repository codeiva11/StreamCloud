name: Pre-release

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

concurrency:
  group: "pre-release"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Keystore
      id: setup_keystore
      run: |
        KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
        mkdir -p "${KEYSTORE_DIR}"
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${KEYSTORE_DIR}/release.keystore"
        
        KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
        KEY_PASS="${{ secrets.SIGNING_KEY_PASSWORD }}"
        STORE_PASS="${{ secrets.SIGNING_STORE_PASSWORD }}"
        
        if [ -z "$STORE_PASS" ] || ! keytool -list -keystore "${KEYSTORE_DIR}/release.keystore" -storepass "$STORE_PASS" > /dev/null 2>&1; then
          if keytool -list -keystore "${KEYSTORE_DIR}/release.keystore" -storepass "Streamcloud@9532" > /dev/null 2>&1; then
            STORE_PASS="Streamcloud@9532"
            KEY_PASS="Streamcloud@9532"
            KEY_ALIAS="Streamcloud"
          elif keytool -list -keystore "${KEYSTORE_DIR}/release.keystore" -storepass "cloudstream123" > /dev/null 2>&1; then
            STORE_PASS="cloudstream123"
            KEY_PASS="cloudstream123"
            KEY_ALIAS="cloudstream"
          fi
        fi
        
        echo "::add-mask::$KEY_PASS"
        echo "::add-mask::$STORE_PASS"
        echo "key_alias=$KEY_ALIAS" >> $GITHUB_OUTPUT
        echo "store_pass=$STORE_PASS" >> $GITHUB_OUTPUT
        echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT
        echo "keystore_dir=${KEYSTORE_DIR}" >> $GITHUB_OUTPUT

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Run Gradle
      run: ./gradlew assemblePrereleaseRelease androidSourcesJar makeJar
      env:
        KEYSTORE_DIR: ${{ steps.setup_keystore.outputs.keystore_dir }}
        SIGNING_KEY_ALIAS: ${{ steps.setup_keystore.outputs.key_alias }}
        SIGNING_KEY_PASSWORD: ${{ steps.setup_keystore.outputs.key_pass }}
        SIGNING_STORE_PASSWORD: ${{ steps.setup_keystore.outputs.store_pass }}
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        DEFAULT_EXTENSION_REPO_URL: ${{ secrets.DEFAULT_EXTENSION_REPO_URL || vars.DEFAULT_EXTENSION_REPO_URL }}

    - name: Create pre-release
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "pre-release"
        prerelease: true
        title: "Pre-release Build"
        files: |
          app/build/outputs/apk/prerelease/release/*.apk
          app/build/libs/app-sources.jar
          app/build/classes.jar
